<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ColorAI</title>
    <link rel="stylesheet" href="sidepanel.css" />
    <script src="vendor/marked.min.js"></script>
    <script src="vendor/purify.min.js"></script>
  </head>
  <body>
    <header class="titlebar">
      <div class="titlebar-brand">
        <span class="titlebar-mark" aria-hidden="true"></span>
        <div class="titlebar-text">
          <h1>ColorAI</h1>
          <p class="titlebar-sub">Chat on the side</p>
        </div>
      </div>
      <div class="titlebar-actions">
        <button type="button" id="btn-reload" class="icon-btn" title="Clear chat" aria-label="Clear chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" stroke-linecap="round" />
            <path d="M21 3v7h-7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <button type="button" id="btn-options" class="icon-btn" title="Settings" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
            />
          </svg>
        </button>
      </div>
    </header>

    <nav class="session-tabs" aria-label="Conversation tabs">
      <button type="button" id="btn-new-session" class="session-new" title="New conversation">+</button>
      <div id="session-tab-list" class="session-tab-list"></div>
    </nav>

    <section class="chat-shell">
      <div class="chat-card" id="chat-card">
        <div class="chat-card-toolbar">
          <span class="chat-card-title">Messages</span>
          <button
            type="button"
            id="btn-toggle-chat"
            class="chat-toggle"
            title="Show or hide messages"
            aria-label="Toggle messages panel"
            aria-expanded="true"
          >
            <span class="chat-toggle-icon" aria-hidden="true">▼</span>
          </button>
        </div>
        <main id="chat" class="chat" aria-live="polite"></main>
      </div>
    </section>

    <footer class="dock">
      <div class="dock-card">
        <div id="selection-quote" class="selection-quote is-hidden" role="region" aria-label="Selected text from page">
          <div class="selection-quote-head">
            <span class="selection-label">Selection</span>
            <button type="button" id="btn-clear-selection" class="text-btn" title="Dismiss">Dismiss</button>
          </div>
          <p id="selection-text" class="selection-body"></p>
        </div>

        <label class="dock-field">
          <span class="dock-field-label">Message</span>
          <textarea id="input" rows="3" placeholder="Ask something…"></textarea>
        </label>

        <p id="status" class="dock-status" role="status"></p>

        <div class="dock-row skill-row">
          <label class="dock-field grow">
            <span class="dock-field-label">Skill</span>
            <select id="skill-select"></select>
          </label>
          <div class="skill-actions">
            <button type="button" id="btn-skill-add" class="btn subtle" title="Add skill">＋</button>
            <button type="button" id="btn-skill-edit" class="btn subtle" title="Edit skill">Edit</button>
            <button type="button" id="btn-skill-delete" class="btn subtle danger" title="Delete skill">Delete</button>
          </div>
        </div>

        <div class="dock-row actions-row actions-primary">
          <button type="button" id="btn-summarize" class="btn pill secondary">Summarize page</button>
          <button
            type="button"
            id="btn-toggle-summary-notes"
            class="chevron-toggle"
            aria-expanded="false"
            aria-label="Summary notes"
            title="Summary notes"
          >
            <span class="chevron-glyph" aria-hidden="true">▶</span>
          </button>
          <button type="button" id="btn-send" class="btn pill primary">Send</button>
        </div>

        <div id="summary-notes-panel" class="summary-notes-panel is-collapsed">
          <label class="dock-field tight">
            <span class="dock-field-label">Summary notes <span class="optional">(optional)</span></span>
            <input type="text" id="summarize-extra" placeholder="Focus, tone, or constraints for summarize…" />
          </label>
        </div>
      </div>
    </footer>

    <dialog id="skill-dialog" class="sheet">
      <form method="dialog" id="skill-form" class="sheet-form">
        <h2 id="skill-dialog-title">Skill</h2>
        <label class="dock-field">
          <span class="dock-field-label">Name</span>
          <input type="text" id="skill-name" required maxlength="80" />
        </label>
        <label class="dock-field">
          <span class="dock-field-label">System prompt</span>
          <textarea id="skill-prompt" rows="6" placeholder="Instructions the model should follow for this skill."></textarea>
        </label>
        <div class="sheet-actions">
          <button type="button" id="skill-cancel" class="btn pill secondary">Cancel</button>
          <button type="submit" class="btn pill primary">Save</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
